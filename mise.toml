[settings]
minimum_release_age = "7d"

[tools]
# Language runtimes used by agents and project scripts.
python = ["3.9", "3.10"]
go = "1.25.12"
node = "24.18.0"
rust = "1.97.1"


# CLI utilities commonly used by agents.
uv = "latest"
npm = "latest"
ripgrep = "latest"
jq = "latest"
yq = "latest"
fd = "latest"
ast-grep = "latest"
gh = "latest"
helm = "latest"


# Python tooling.
"pipx:black" = "latest"

# Go tooling.
"go:golang.org/x/tools/gopls" = "latest"

# Formatters, linters, and language servers installed from npm.
"go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:@vue/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:oxlint" = "latest"
"npm:prettier" = "latest"
"npm:pyright" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:@playwright/cli" = "latest"
"npm:@colbymchenry/codegraph" = "latest"

# Python linters/type checkers exposed through pipx.
"pipx:basedpyright" = "latest"
"pipx:ruff" = "latest"

"github:artifacthub/hub" = "latest"
"npm:defuddle" = "latest"


opencode = "2.1.4"
"go:github.com/grafana/gcx/cmd/gcx" = "latest"
"go:github.com/tailscale/aperture-cli/cmd/aperture" = "v0.1.0"

kubectl = "latest"
helmfile = "latest"
codex = "0.155.0"
ruby = "latest"
chezmoi = "latest"
act = "0.2.89"
"pipx:shodan" = "latest"
