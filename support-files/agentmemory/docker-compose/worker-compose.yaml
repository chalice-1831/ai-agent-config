# Based on agentmemory v0.9.31 deploy/runtime/worker-compose.yaml.
namespace: agentmemory
startup_timeout: 300s
stop_timeout: 20s
required_default: true
engine:
  url: ws://127.0.0.1:49134
  workers:
    configuration:
      adapter:
        name: fs
        config:
          directory: /data/config
    iii-worker-manager:
      host: 127.0.0.1
      port: 49134
containers:
  state:
    worker: package://api.workers.iii.dev/state
    version: "${STATE_VERSION}"
    config_name: state
    restart:
      condition: on-failure
      delay: 500ms
      max_delay: 30s
      max_attempts: 5
      window: 60s
    config_override:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: /data/state_store.db
          save_interval_ms: "${AGENTMEMORY_STATE_SAVE_INTERVAL_MS:-2000}"
  http:
    worker: package://api.workers.iii.dev/http
    version: "${HTTP_VERSION}"
    config_name: http
    restart:
      condition: on-failure
      delay: 500ms
      max_delay: 30s
      max_attempts: 5
      window: 60s
    config_override:
      host: 0.0.0.0
      port: 3111
      default_timeout: 180000
      cors:
        allowed_origins: ["__REST_ALLOWED_ORIGINS__"]
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  agentmemory:
    worker: path://.
    working_dir: /opt/agentmemory
    start_after: [state, http]
    startup_timeout: 300s
    config_name: agentmemory
    restart:
      condition: on-failure
      delay: 500ms
      max_delay: 30s
      max_attempts: 5
      window: 60s
    scripts:
      # start_after waits for worker registration, not state function readiness.
      pre_run_timeout: 120s
      pre_run: >-
        sh -ec 'for attempt in $(seq 1 60); do
        if iii trigger --engine ws://127.0.0.1:49134 --namespace agentmemory
        --timeout-ms 1000 state::get
        --json '\''{"scope":"mem:bm25-index","key":"__readiness_probe__"}'\''
        >/dev/null 2>&1; then exit 0; fi;
        sleep 1; done;
        echo "state::get did not become ready" >&2; exit 1'
      run: node /opt/agentmemory/dist/index.mjs
    environment:
      HOME: /data/home
      AGENTMEMORY_DATA_DIR: /data
      III_ENGINE_URL: ws://127.0.0.1:49134
      III_ENGINE_PORT: "49134"
      III_REST_PORT: "3111"
      III_VIEWER_PORT: "3113"
      III_TELEMETRY_ENABLED: "false"
      AGENTMEMORY_VIEWER_HOST: "${AGENTMEMORY_VIEWER_HOST:-0.0.0.0}"
      VIEWER_ALLOWED_HOSTS: "${VIEWER_ALLOWED_HOSTS:-localhost:3113,127.0.0.1:3113}"
      VIEWER_ALLOWED_ORIGINS: "${VIEWER_ALLOWED_ORIGINS:-http://localhost:3113,http://127.0.0.1:3113}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-}"
      OPENAI_EMBEDDING_DIMENSIONS: "${OPENAI_EMBEDDING_DIMENSIONS:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
      AGENTMEMORY_AUTO_COMPRESS: "${AGENTMEMORY_AUTO_COMPRESS:-}"
      GRAPH_EXTRACTION_ENABLED: "${GRAPH_EXTRACTION_ENABLED:-}"
      AGENTMEMORY_INJECT_CONTEXT: "${AGENTMEMORY_INJECT_CONTEXT:-}"
      RERANK_ENABLED: "${RERANK_ENABLED:-}"
      BM25_WEIGHT: "${BM25_WEIGHT:-}"
      VECTOR_WEIGHT: "${VECTOR_WEIGHT:-}"
      AGENTMEMORY_GRAPH_WEIGHT: "${AGENTMEMORY_GRAPH_WEIGHT:-}"
      TOKEN_BUDGET: "${TOKEN_BUDGET:-}"
      MAX_OBS_PER_SESSION: "${MAX_OBS_PER_SESSION:-}"
      SUMMARIZE_CHUNK_SIZE: "${SUMMARIZE_CHUNK_SIZE:-}"
      SUMMARIZE_CHUNK_CONCURRENCY: "${SUMMARIZE_CHUNK_CONCURRENCY:-}"
      CONSOLIDATION_ENABLED: "${CONSOLIDATION_ENABLED:-}"
      CONSOLIDATION_DECAY_DAYS: "${CONSOLIDATION_DECAY_DAYS:-}"
      GRAPH_EXTRACTION_BATCH_SIZE: "${GRAPH_EXTRACTION_BATCH_SIZE:-}"
      AGENTMEMORY_LLM_NOTHINK: "${AGENTMEMORY_LLM_NOTHINK:-}"
      AGENTMEMORY_SLOTS: "${AGENTMEMORY_SLOTS:-}"
      AGENTMEMORY_REFLECT: "${AGENTMEMORY_REFLECT:-}"
      AGENTMEMORY_DROP_STALE_INDEX: "${AGENTMEMORY_DROP_STALE_INDEX:-}"
      AGENTMEMORY_IMAGE_EMBEDDINGS: "${AGENTMEMORY_IMAGE_EMBEDDINGS:-}"
      AGENTMEMORY_TOOLS: "${AGENTMEMORY_TOOLS:-all}"
      AGENTMEMORY_EXPORT_ROOT: "${AGENTMEMORY_EXPORT_ROOT:-}"
      AGENTMEMORY_VIEWER_URL: "${AGENTMEMORY_VIEWER_URL:-}"
      SNAPSHOT_ENABLED: "${SNAPSHOT_ENABLED:-}"
      SNAPSHOT_DIR: "${SNAPSHOT_DIR:-}"
      SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-}"
      TEAM_MODE: "${TEAM_MODE:-}"
      TEAM_ID: "${TEAM_ID:-}"
      USER_ID: "${USER_ID:-}"
      AGENTMEMORY_SECRET: "${AGENTMEMORY_SECRET:-}"
      AGENTMEMORY_STATE_BACKEND: "${AGENTMEMORY_STATE_BACKEND:-}"
      AGENTMEMORY_STATE_SAVE_INTERVAL_MS: "${AGENTMEMORY_STATE_SAVE_INTERVAL_MS:-2000}"
      PATH: /usr/local/bin:/usr/bin:/bin
      MALLOC_ARENA_MAX: "2"
