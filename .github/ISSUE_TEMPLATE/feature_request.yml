name: 功能请求 / Feature Request
description: 提出新功能或改进建议 / Suggest a feature or improvement
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能建议！
        Thanks for suggesting a feature!

        提交前请先搜索现有 issues，避免重复。
        Please search existing issues before submitting to avoid duplicates.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submission Checklist
      options:
        - label: 我已搜索现有 issues，此功能尚未被提出 / I have searched existing issues and this feature has not been requested
          required: true
        - label: 我已阅读 [项目文档 / Documentation](https://github.com/zouxingyuks/ai-agent-config/blob/master/README.md)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Statement
      description: 这个请求要解决什么问题？/ What problem would this request solve?
      placeholder: 当前的问题是... / The current problem is...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 描述你希望实现的效果 / Describe the solution you would like
      placeholder: 清晰简洁地描述期望行为 / Describe the desired behavior clearly
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 描述你考虑过的其他方案 / Describe alternatives you considered
      placeholder: 列出其他替代思路... / List other approaches...

  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Feature Category
      description: 该功能属于哪个方向？/ Which area does this relate to?
      options:
        - Agent rules / AGENTS.md
        - OpenCode configuration or plugins / opencode/
        - Codex or MCP / codex/
        - Skills / skills/
        - Installation and sync / scripts and *.sh
        - CI and repository automation / .github/
        - Documentation / README.md
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景 / Use Case
      description: 此功能会如何被使用？/ How would this feature be used?
      placeholder: 例如：当需要在多台机器同步配置时... / For example, when syncing configuration across machines...

  - type: textarea
    id: additional
    attributes:
      label: 附加信息 / Additional Context
      description: 补充参考资料、原型或截图 / Add references, mockups, or screenshots
