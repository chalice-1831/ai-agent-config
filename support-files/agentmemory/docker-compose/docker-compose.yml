services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.29"
        III_VERSION: "0.22.1"
        III_SDK_VERSION: "0.22.1"
    container_name: agentmemory
    restart: unless-stopped
    ports:
      - "0.0.0.0:3111:3111"
      - "127.0.0.1:3113:3113"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:8090/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-sol}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-Qwen3-Embedding-8B}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-4096}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      AGENTMEMORY_AUTO_COMPRESS: ${AGENTMEMORY_AUTO_COMPRESS:-false}
      GRAPH_EXTRACTION_ENABLED: ${GRAPH_EXTRACTION_ENABLED:-false}
      AGENTMEMORY_INJECT_CONTEXT: ${AGENTMEMORY_INJECT_CONTEXT:-false}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      BM25_WEIGHT: ${BM25_WEIGHT:-0.4}
      VECTOR_WEIGHT: ${VECTOR_WEIGHT:-0.6}
      AGENTMEMORY_GRAPH_WEIGHT: ${AGENTMEMORY_GRAPH_WEIGHT:-0.2}
      TOKEN_BUDGET: ${TOKEN_BUDGET:-2000}
      MAX_OBS_PER_SESSION: ${MAX_OBS_PER_SESSION:-500}
      SUMMARIZE_CHUNK_SIZE: ${SUMMARIZE_CHUNK_SIZE:-400}
      SUMMARIZE_CHUNK_CONCURRENCY: ${SUMMARIZE_CHUNK_CONCURRENCY:-6}
      CONSOLIDATION_ENABLED: ${CONSOLIDATION_ENABLED:-}
      CONSOLIDATION_DECAY_DAYS: ${CONSOLIDATION_DECAY_DAYS:-30}
      GRAPH_EXTRACTION_BATCH_SIZE: ${GRAPH_EXTRACTION_BATCH_SIZE:-8}
      AGENTMEMORY_LLM_NOTHINK: ${AGENTMEMORY_LLM_NOTHINK:-}
      AGENTMEMORY_REFLECT: ${AGENTMEMORY_REFLECT:-}
      AGENTMEMORY_DROP_STALE_INDEX: ${AGENTMEMORY_DROP_STALE_INDEX:-}
      AGENTMEMORY_IMAGE_EMBEDDINGS: ${AGENTMEMORY_IMAGE_EMBEDDINGS:-}
      AGENTMEMORY_TOOLS: ${AGENTMEMORY_TOOLS:-all}
      AGENTMEMORY_DATA_DIR: ${AGENTMEMORY_DATA_DIR:-/data}
      AGENTMEMORY_EXPORT_ROOT: ${AGENTMEMORY_EXPORT_ROOT:-}
      AGENTMEMORY_VIEWER_URL: ${AGENTMEMORY_VIEWER_URL:-}
      SNAPSHOT_ENABLED: ${SNAPSHOT_ENABLED:-}
      SNAPSHOT_DIR: ${SNAPSHOT_DIR:-/data/snapshots}
      SNAPSHOT_INTERVAL: ${SNAPSHOT_INTERVAL:-3600}
      TEAM_MODE: ${TEAM_MODE:-}
      TEAM_ID: ${TEAM_ID:-}
      USER_ID: ${USER_ID:-}
      AGENTMEMORY_VIEWER_HOST: 0.0.0.0
      VIEWER_ALLOWED_HOSTS: ${VIEWER_ALLOWED_HOSTS:-localhost:3113,127.0.0.1:3113}
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
