name: 建议与讨论 / Discussion & Proposal
description: 提出项目改进方向或需要先讨论的方案 / Discuss an improvement or unsettled proposal
title: "[IDEA]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法和建议！开放性讨论有助于项目持续演进。
        Welcome to share ideas and proposals!

        提交前请先搜索现有 issues，避免重复。
        Please search existing issues before submitting to avoid duplicates.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Pre-submission Checklist
      options:
        - label: 我已搜索现有 issues，此议题尚未被讨论 / I have searched existing issues and this topic has not been discussed
          required: true

  - type: dropdown
    id: proposal_type
    attributes:
      label: 提案类型 / Proposal Type
      description: 选择最符合的类型 / Select the best-fitting types
      multiple: true
      options:
        - 新功能建议 / New Feature
        - 架构与配置改进 / Architecture and Configuration
        - 安全与隐私 / Security and Privacy
        - Agent 工作流 / Agent Workflow
        - 工程实践改进 / Engineering Practice
        - 文档改进 / Documentation
        - 其他讨论 / Other
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景与动机 / Background & Motivation
      description: 描述当前问题或局限，以及为什么需要改进 / Describe the problem or limitation and why it matters
      placeholder: 目前存在的问题是... / The current problem is...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案描述 / Proposal Description
      description: 详细描述你的想法或讨论点 / Describe your idea or discussion point
      placeholder: 我的建议是... / My proposal is...
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: 预期收益 / Expected Benefits
      description: 这个改变会带来什么好处？/ What benefits would this bring?
      placeholder: |
        - 提升...
        - 解决...
        - 改善...

  - type: textarea
    id: implementation
    attributes:
      label: 可能的实现方式 / Possible Implementation
      description: 如果有初步思路，请描述（可选）/ Describe an initial approach, if any (optional)
      placeholder: |
        概念验证思路：
        1. ...
        2. ...

  - type: textarea
    id: additional
    attributes:
      label: 附加信息 / Additional Context
      description: 补充参考资料或截图 / Add references or screenshots
