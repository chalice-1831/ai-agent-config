# Shared MCP server definitions.

[mcp_servers.serena]
enabled = false
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "ide", "--open-web-dashboard", "false", "--project-from-cwd"]

[mcp_servers.codegraph]
enabled = true
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.sequential-thinking]
enabled = true
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[mcp_servers.exa]
enabled = true
command = "npx"
args = ["-y", "exa-mcp-server"]

[mcp_servers.context7]
enabled = true
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.agentmemory]
command = "npx"
args = ["-y", "@agentmemory/mcp"]
env_vars = ["AGENTMEMORY_URL", "AGENTMEMORY_SECRET"]

[mcp_servers.deepwiki]
enabled = true
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.gh_grep]
enabled = true
url = "https://mcp.grep.app"

[mcp_servers.mise]
enabled = true
command = "mise"
args = ["mcp"]

[mcp_servers.mise.env]
MISE_EXPERIMENTAL = "1"
