services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.29"
        III_VERSION: "0.22.1"
        III_SDK_VERSION: "0.22.1"
    container_name: agentmemory
    restart: unless-stopped
    ports:
      - "0.0.0.0:3111:3111"
      - "127.0.0.1:3113:3114"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_AUTH_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_AUTH_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_AUTH_TOKEN:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${AGENTMEMORY_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${AGENTMEMORY_EMBEDDING_MODEL:-Qwen3-Embedding-8B}
      OPENAI_EMBEDDING_DIMENSIONS: ${AGENTMEMORY_EMBEDDING_DIMENSIONS:-4096}
      OPENAI_API_KEY_FOR_LLM: ${OPENAI_AUTH_TOKEN:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDING_PROVIDER: ${AGENTMEMORY_EMBEDDING_PROVIDER:-}
      AGENTMEMORY_AUTO_COMPRESS: ${AGENTMEMORY_AUTO_COMPRESS:-false}
      GRAPH_EXTRACTION_ENABLED: ${AGENTMEMORY_GRAPH_EXTRACTION_ENABLED:-false}
      AGENTMEMORY_INJECT_CONTEXT: ${AGENTMEMORY_INJECT_CONTEXT:-false}
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
