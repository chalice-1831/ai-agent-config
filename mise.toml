[settings]
minimum_release_age = "0s"
exec_auto_install = false

[tools]
# 语言运行时与包管理器
go = "1.26.10"
node = "lts"
rust = "stable"
pnpm = "latest"
uv = "latest"
dotnet = "lts"
python = ["3.6", "3.11"]

# 终端与日常操作
fzf = "latest"
zoxide = "latest"
eza = "latest"
bat = "latest"
starship = "latest"
trzsz-ssh = "latest"
dust = "latest"
yazi = "latest"
chezmoi = "latest"
age = "latest"

# AI Agent
opencode = "latest"
codex = "latest"
pi = "1.3.0"

# 文件搜索、代码搜索与数据处理
ast-grep = "latest"
ripgrep = "latest"
fd = "latest"
jq = "latest"
yq = "latest"

# Git 与代码托管
gh = "latest"
lazygit = "latest"

# 构建、接口定义与部署
helm = "latest"
cmake = "latest"
ninja = "latest"

# GitHub 来源
"github:clice-io/clice" = { version = "latest", prerelease = true }

# Conda 模块来源
"conda:clang-format" = "latest"
"conda:clang" = "latest"
"conda:clangxx" = "latest"

# Go 模块来源
"go:github.com/go-delve/delve/cmd/dlv" = { version = "v1.26.3", depends = "go@1.26.10" }
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = { version = "v2.9.0", depends = "go@1.26.10" }
"go:github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2" = { version = "v2.27.2", depends = "go@1.26.10" }
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = { version = "v1.36.5", depends = "go@1.26.10" }
"go:github.com/grafana/gcx/cmd/gcx" = { version = "latest", depends = "go@1.26.10" }
"go:mvdan.cc/sh/v3/cmd/shfmt" = { version = "latest", depends = "go@1.26.10" }
"go:golang.org/x/tools/gopls" = { version = "latest", depends = "go@1.26.10" }

# PyPI 来源
"pypi:ruff" = "latest"

# npm 来源
"npm:@biomejs/biome" = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:@vue/language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:oxlint" = "latest"
"npm:prettier" = "latest"
"npm:basedpyright" = "latest"
"npm:typescript-language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
"npm:@playwright/cli" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:defuddle" = "latest"
"npm:@bufbuild/buf" = "latest"
"npm:@blueking/bk-cli" = "latest"

# dotnet 来源
"dotnet:git-credential-manager" = "latest"